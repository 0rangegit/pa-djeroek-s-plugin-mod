<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pa djeroek plugin preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: monospace;
      color: #f8fafc;
      background: linear-gradient(135deg, #020617, #111827);
    }

    .shell {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(100%, 980px);
      height: min(90vh, 780px);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 20px 42px rgba(0,0,0,0.35);
      background: #020617;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <iframe src="/ui.html" title="plugin preview"></iframe>
    </div>
  </div>
</body>
</html>
